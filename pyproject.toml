[build-system]
requires = ["setuptools>=77", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "rrikindp"
dynamic = ["version"]
description = "Evaluation of thermodynamic and kinetic features of RNA-RNA interactions"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Maria Waldl", email = "code@waldl.org" }]
license = "GPL-3.0-only"
license-files = ["COPYING"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/mwaldl/RRIkinDP"
Documentation = "https://github.com/mwaldl/RRIkinDP#readme"
Publication = "https://doi.org/10.1101/2023.07.28.548983"

[tool.setuptools]
# the C++ sources are build inputs, they are not installed with the package
include-package-data = false
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
